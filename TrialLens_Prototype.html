<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrialLens – Agentic Clinical Trial Assistant (prototype)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>button[style*="background: #1F6FB2"],button[style*="border: 1px solid #C5CED8"],button[style*="border: 1px solid #067647"],button[style*="border: 1px solid #1F6FB2"]{height:40px!important;min-height:40px!important;padding:0 16px!important;font-size:14px!important;font-weight:600!important;border-radius:8px!important;white-space:nowrap;min-width:150px;justify-content:center}
button[aria-label="Send"]{min-width:46px;padding:0!important}
body{margin:0;background:#EAF2FA}
a{color:#1F6FB2}a:hover{color:#164F80}
button[style*="background: #1F6FB2"],button[style*="border: 1px solid #C5CED8"],button[style*="border: 1px solid #067647"],button[style*="border: 1px solid #1F6FB2"]{height:40px!important;min-height:40px!important;padding:0 16px!important;font-size:14px!important;font-weight:600!important;border-radius:8px!important;white-space:nowrap;min-width:150px;justify-content:center}
button[aria-label="Send"]{min-width:46px;padding:0!important}
body{margin:0;background:#EAF2FA}
a{color:#1F6FB2}a:hover{color:#164F80}
.mono{font-family:'IBM Plex Mono',monospace}</style></head>
<body><div id="root"></div>
<template id="tpl-Main">
<div style="min-height: 820px; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #0F1B2D; background: #EAF2FA">
  <section style="flex: 1 1 520px; min-width: 0; background: #1E5A8E; color: #FFFFFF; padding: 56px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect x="2" y="2" width="32" height="32" rx="8" fill="none" stroke="#9CCBF2" stroke-width="2.5"/><path d="M10 18h5l3-7 4 14 3-7h3" fill="none" stroke="#9CCBF2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size: 22px; font-weight: 600; letter-spacing: -0.01em">TrialLens</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px; max-width: 520px">
      <h1 style="margin: 0; font-size: 40px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em">Every answer cited.<br>Every inconsistency caught.</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.55; color: #DCE8F4">An agentic assistant that summarizes clinical trial documents, answers questions with source citations and checks protocols, consent forms and submissions against each other.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px; max-width: 520px">
      <div style="display: flex; gap: 14px; align-items: flex-start">
        <span style="flex: none; width: 32px; height: 32px; border-radius: 8px; background: #2C6AA0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CCBF2" stroke-width="2" aria-hidden="true"><path d="M4 4h12l4 4v12H4z"/><path d="M8 12h8M8 16h5"/></svg></span>
        <div><div style="font-weight: 600; font-size: 15px">Summaries tailored to each role</div><div style="font-size: 14px; color: #D6E4F2; line-height: 1.5">Each claim links to a page and paragraph and is checked against its source by a separate verification step.</div></div>
      </div>
      <div style="display: flex; gap: 14px; align-items: flex-start">
        <span style="flex: none; width: 32px; height: 32px; border-radius: 8px; background: #2C6AA0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CCBF2" stroke-width="2" aria-hidden="true"><path d="M7 7h10M7 12h10M7 17h6"/><circle cx="18" cy="17" r="3"/></svg></span>
        <div><div style="font-weight: 600; font-size: 15px">Cross-document consistency agent</div><div style="font-size: 14px; color: #D6E4F2; line-height: 1.5">Compares Protocol, ICF and SAP on visits, eligibility, dosing and endpoints.</div></div>
      </div>
      <div style="display: flex; gap: 14px; align-items: flex-start">
        <span style="flex: none; width: 32px; height: 32px; border-radius: 8px; background: #2C6AA0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CCBF2" stroke-width="2" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span>
        <div><div style="font-weight: 600; font-size: 15px">Governed by design</div><div style="font-size: 14px; color: #D6E4F2; line-height: 1.5">PHI redaction before the LLM, role-based retrieval, hash-chained audit trail, full agent tracing.</div></div>
      </div>
    </div>
    <div style="margin-top: auto; font-size: 13px; color: #C3D6EA">Prototype · synthetic, de-identified trial data only</div>
  </section>

  <section style="flex: 1 1 460px; min-width: 0; padding: 56px 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
    <div style="width: 100%; max-width: 440px; background: #FFFFFF; border: 1px solid #DDE3EA; border-radius: 14px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
      <div>
        <h2 style="margin: 0 0 6px; font-size: 22px; font-weight: 600">Sign in</h2>
        <p style="margin: 0; font-size: 14px; color: #4A5768">Use your work email. Your role is detected from your account.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="email" style="font-size: 13px; font-weight: 500">Work email</label>
        <input id="email" type="email" autocomplete="username" value="{{email}}" onInput="{{setEmail}}" style="height: 44px; border: 1px solid #C5CED8; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; color: #0F1B2D">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="pwd" style="font-size: 13px; font-weight: 500">Password</label>
        <input id="pwd" type="password" autocomplete="current-password" value="demo1234" style="height: 44px; border: 1px solid #C5CED8; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; color: #0F1B2D">
      </div>
      <div role="status" style="{{roleBox}}">
        <span style="font-size: 12px; color: #4A5768">Role</span>
        <span style="font-size: 15px; font-weight: 600">{{roleName}}</span>
        <span style="font-size: 13px; color: #4A5768">{{roleDesc}}</span>
      </div>
      <template data-if value="{{found}}" hint-placeholder-val="{{ true }}">
        <a href="Workspace.dc.html" style="height: 40px; border-radius: 8px; background: #1F6FB2; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; text-decoration: none">Sign in</a>
      </template>
      <template data-if value="{{notFound}}" hint-placeholder-val="{{ false }}">
        <span aria-disabled="true" style="height: 40px; border-radius: 8px; background: #B5C7DA; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">Sign in</span>
      </template>
      <div style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4A5768">
        Demo accounts (password: any)
        <div style="display: flex; flex-wrap: wrap; gap: 4px 10px">
          <template data-for list="{{accounts}}" as="ac" hint-placeholder-count="5"><button type="button" onClick="{{ac.fill}}" style="font: inherit; font-size: 12px; background: none; border: 0; padding: 2px 0; color: #164F80; text-decoration: underline; cursor: pointer">{{ac.email}}</button></template>
        </div>
      </div>
    </div>
  </section>
</div>
</template><template id="tpl-Workspace">
<div style="min-height: 1000px; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #0F1B2D; background: #EAF2FA; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; box-sizing: border-box; align-items: flex-start">

  <nav aria-label="Main menu" style="flex: 0 0 220px; background: #1E5A8E; color: #FFFFFF; border-radius: 16px; padding: 22px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; min-height: 940px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; font-weight: 600; font-size: 20px">
      <svg width="28" height="28" viewBox="0 0 36 36" aria-hidden="true"><rect x="2" y="2" width="32" height="32" rx="8" fill="none" stroke="#9CCBF2" stroke-width="3"/><path d="M10 18h5l3-7 4 14 3-7h3" fill="none" stroke="#9CCBF2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>TrialLens</div>
    <div style="font-size: 11px; letter-spacing: 0.08em; color: #B8D3EC; padding: 0 8px 6px">MAIN MENU</div>
    <template data-for list="{{nav}}" as="n" hint-placeholder-count="4"><button type="button" onClick="{{n.pick}}" style="{{n.style}}">{{n.label}}</button></template>
    <div style="font-size: 11px; letter-spacing: 0.08em; color: #B8D3EC; padding: 18px 8px 6px">GENERAL</div>
    <a href="Main.dc.html" style="color: #FFB4A8; font-size: 14px; padding: 10px 12px; text-decoration: none">Log out</a>
    <div style="margin-top: auto; font-size: 12px; color: #B8D3EC; padding: 8px; line-height: 1.5">Synthetic, de-identified data · all actions audited</div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: #FFFFFF; border-radius: 14px; padding: 10px 16px">
      <h1 style="margin: 0; font-size: 20px; font-weight: 600">{{viewTitle}}</h1>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 10px">
        <span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 50%; background: #1F6FB2; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">{{initials}}</span>
        <div><div style="font-size: 14px; font-weight: 600">{{userName}}</div><div style="font-size: 12px; color: #4A5768">{{roleFull}}</div></div>
      </div>
    </div>

    <template data-if value="{{isDash}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <section style="background: #DCEBF8; border-radius: 14px; padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center">
          <div style="flex: 1 1 260px; min-width: 0">
            <h2 style="margin: 0 0 2px; font-size: 18px; font-weight: 600; color: #1E5A8E">Good morning, {{who}}</h2>
            <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #2A4A66">{{greet}}</p>
          </div>
          <div style="flex: 2 1 460px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px">
            <template data-for list="{{kpis}}" as="k" hint-placeholder-count="4">
              <div title="{{k.note}}" style="background: #FFFFFF; border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 22px; font-weight: 600; color: #1E5A8E">{{k.value}}</span><span style="font-size: 12px; color: #33414F; line-height: 1.3">{{k.label}}</span></div>
            </template>
          </div>
        </section>

        <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
          <section aria-label="{{boxTitle}}" style="{{boxStyle}}">
            <div style="display: flex; align-items: center; gap: 10px"><h2 style="margin: 0; font-size: 16px; font-weight: 600; color: {{boxInk}}">{{boxTitle}}</h2></div>
            <template data-if value="{{isAud}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12px; color: #33414F">AI output stays a draft until QA review and e-signature (21 CFR Part 11).</div></template>
            <div role="tablist" style="display: flex; gap: 4px; border-bottom: 1px solid #E6D6B8">
              <template data-for list="{{actTabs}}" as="tb" hint-placeholder-count="2"><button type="button" role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="{{tb.style}}">{{tb.label}}</button></template>
            </div>
            <template data-for list="{{acts}}" as="x" hint-placeholder-count="3">
              <div style="display: flex; gap: 10px; align-items: center; background: #FFFFFF; border: 1px solid #EEE3D0; border-radius: 10px; padding: 8px 10px">
                <span style="{{x.pStyle}}">{{x.p}}</span>
                <div style="flex: 1; min-width: 0"><div style="font-size: 13px; font-weight: 500; line-height: 1.35">{{x.t}}</div><div style="font-size: 12px; color: #4A5768">{{x.due}}</div></div>
                <button type="button" style="flex: none; min-height: 36px; padding: 0 12px; border-radius: 8px; border: 0; background: #1F6FB2; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">{{x.btn}}</button>
              </div>
            </template>
          </section>

          <section style="flex: 1 1 380px; min-width: 0; background: #FFFFFF; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; gap: 14px; align-items: center">
              <div style="{{ring}}"><div style="width: 64px; height: 64px; border-radius: 50%; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 22px; font-weight: 600; color: #1E5A8E">{{conf}}</span><span style="font-size: 10px; color: #4A5768">confidence</span></div></div>
              <div><h2 style="margin: 0; font-size: 16px; font-weight: 600">Study intelligence scorecard</h2><div style="font-size: 12px; color: #4A5768">CT-204 · your lens · hover a row for the finding</div></div>
            </div>
            <template data-for list="{{score}}" as="s" hint-placeholder-count="5">
              <div title="{{s.d}}" style="display: flex; gap: 10px; align-items: center">
                <span style="flex: 0 0 170px; font-size: 13px; font-weight: 500">{{s.n}}</span>
                <div style="flex: 1 1 80px; height: 8px; background: #EAF2FA; border-radius: 4px"><div style="{{s.bar}}"></div></div>
                <span style="width: 36px; font-size: 13px; font-weight: 600; text-align: right">{{s.v}}</span>
                <span style="{{s.tagStyle}}">{{s.tag}}</span>
              </div>
            </template>
          </section>
        </div>

        <template data-if value="{{isGen}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; gap: 16px">
          <section style="flex: 1 1 360px; min-width: 0; background: #FFFFFF; border-radius: 14px; padding: 18px; display: flex; gap: 20px; flex-wrap: wrap; align-items: center">
            <h2 style="margin: 0; font-size: 16px; font-weight: 600; flex-basis: 100%">Documents indexed</h2>
            <div style="width: 150px; height: 150px; border-radius: 50%; background: conic-gradient(#1F6FB2 0 33%, #6FA8DC 33% 66%, #F2A65A 66% 77%, #8C9EDB 77% 88%, #E58C8A 88% 100%); display: flex; align-items: center; justify-content: center">
              <div style="width: 104px; height: 104px; border-radius: 50%; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 12px; color: #4A5768">Total</span><span style="font-size: 28px; font-weight: 600">9</span></div>
            </div>
            <div style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
              <div style="display: flex; justify-content: space-between"><span><span style="color: #1F6FB2">●</span> Protocol &amp; amendments</span><b>3</b></div>
              <div style="display: flex; justify-content: space-between"><span><span style="color: #6FA8DC">●</span> Consent forms</span><b>3</b></div>
              <div style="display: flex; justify-content: space-between"><span><span style="color: #F2A65A">●</span> SAP</span><b>1</b></div>
              <div style="display: flex; justify-content: space-between"><span><span style="color: #8C9EDB">●</span> Investigator's Brochure</span><b>1</b></div>
              <div style="display: flex; justify-content: space-between"><span><span style="color: #E58C8A">●</span> Regulatory submission</span><b>1</b></div>
            </div>
          </section>
          <section style="flex: 1 1 300px; min-width: 0; background: #FFFFFF; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
            <h2 style="margin: 0; font-size: 16px; font-weight: 600">Discrepancies · {{roleShort}}</h2>
            <template data-for list="{{bars}}" as="b" hint-placeholder-count="3">
              <div style="display: flex; flex-direction: column; gap: 4px"><div style="display: flex; justify-content: space-between; font-size: 13px"><span>{{b.label}}</span><b>{{b.n}}</b></div><div style="height: 10px; background: #EAF2FA; border-radius: 5px"><div style="{{b.bar}}"></div></div></div>
            </template>
            <h2 style="margin: 8px 0 0; font-size: 16px; font-weight: 600">Upcoming</h2>
            <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px">
              <div style="display: flex; gap: 10px"><span class="mono" style="color: #1F6FB2; width: 48px">03 Dec</span>ICF v1.4 approval due</div>
              <div style="display: flex; gap: 10px"><span class="mono" style="color: #1F6FB2; width: 48px">05 Dec</span>Site 012 re-consent deadline</div>
              <div style="display: flex; gap: 10px"><span class="mono" style="color: #1F6FB2; width: 48px">15 Dec</span>Data cut for safety review</div>
            </div>
          </section>
        </div>
        </template>

        <template data-if value="{{isCom}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-wrap: wrap; gap: 16px">
            <section style="flex: 2 1 420px; min-width: 0; background: #FFFFFF; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 16px; font-weight: 600">Site status &amp; enrollment</h2>
              <div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-around">
                <template data-for list="{{rings}}" as="r" hint-placeholder-count="3">
                  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="{{r.ring}}"><div style="width: 66px; height: 66px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">{{r.v}}</div></div><div style="font-size: 13px; font-weight: 500">{{r.l}}</div><div style="font-size: 12px; color: #4A5768">{{r.d}}</div></div>
                </template>
              </div>
            </section>
            <section style="flex: 1 1 280px; min-width: 0; background: #FFFFFF; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
              <h2 style="margin: 0; font-size: 16px; font-weight: 600">Monitoring compliance</h2>
              <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap">
                <div><div style="font-size: 13px; color: #4A5768">Visits overdue</div><div style="font-size: 40px; font-weight: 600"><span style="color: #B42318">2</span><span style="color: #8A97A6"> / 6</span></div></div>
                <div><div style="font-size: 13px; color: #4A5768">Visit reports on time</div><div style="font-size: 40px; font-weight: 600; color: #1E5A8E">64%</div><div style="font-size: 12px; color: #4A5768">target 80%</div></div>
              </div>
              <div style="font-size: 12px; color: #4A5768">Overdue: Site 012 interim visit, Site 027 close-out</div>
            </section>
          </div>
        </template>

        <template data-if value="{{isCra}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-wrap: wrap; gap: 16px">
            <section style="flex: 1 1 300px; min-width: 0; background: #FFFFFF; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
              <h2 style="margin: 0; font-size: 16px; font-weight: 600">Open queries by type</h2>
              <div style="display: flex; gap: 14px; align-items: flex-end; height: 100px; border-bottom: 1px solid #D6E4F0">
                <template data-for list="{{qtypes}}" as="p" hint-placeholder-count="5"><div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%"><span style="font-size: 13px; font-weight: 600">{{p.n}}</span><div style="{{p.bar}}"></div></div></template>
              </div>
              <div style="display: flex; gap: 14px"><template data-for list="{{qtypes}}" as="p" hint-placeholder-count="5"><span style="flex: 1; text-align: center; font-size: 12px; color: #4A5768">{{p.l}}</span></template></div>
            </section>
            <template data-for list="{{craRings}}" as="r" hint-placeholder-count="2">
              <section style="flex: 1 1 200px; min-width: 0; background: #FFFFFF; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px">
                <h2 style="margin: 0; font-size: 16px; font-weight: 600; align-self: flex-start">{{r.l}}</h2>
                <div style="{{r.ring}}"><div style="width: 66px; height: 66px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">{{r.v}}</div></div>
                <div style="font-size: 12px; color: #4A5768">{{r.d}}</div>
              </section>
            </template>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 16px">
            <section style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border-radius: 14px; padding: 18px">
              <h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 600">ICF versions pending review</h2>
              <template data-for list="{{icf}}" as="t" hint-placeholder-count="3"><div style="display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid #EAF2FA; padding: 8px 0; font-size: 14px"><span>{{t.a}}</span><span style="color: #4A5768">{{t.b}}</span></div></template>
            </section>
            <section style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border-radius: 14px; padding: 18px">
              <h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 600">Queries waiting for my review</h2>
              <template data-for list="{{qwait}}" as="t" hint-placeholder-count="3"><div style="display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid #EAF2FA; padding: 8px 0; font-size: 14px"><span>{{t.a}}</span><span style="color: #4A5768">{{t.b}}</span></div></template>
            </section>
          </div>
        </template>

        <template data-if value="{{isAud}}" hint-placeholder-val="{{ false }}">
          <section style="background: #FFFFFF; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
            <h2 style="margin: 0; font-size: 16px; font-weight: 600">AI output lifecycle</h2>

const App={screen:'Main',inst:{},
 get(n){return this.inst[n]||(this.inst[n]=new (window['C_'+n]||eval('C_'+n))({}))},
 look(scope,p){p=p.trim();if(p==='true')return true;if(p==='false')return false;if(/^-?\d+(\.\d+)?$/.test(p))return +p;if(/^['"].*['"]$/.test(p))return p.slice(1,-1);return p.split('.').reduce((o,k)=>o==null?o:o[k],scope)},
 interp(scope,s){return s.replace(/\{\{(.*?)\}\}/g,(m,p)=>{const v=this.look(scope,p);return v==null?'':v})},
 comp(n){const c=this.get(n);const vals=c.renderVals();const f=document.createDocumentFragment();this.walk(document.getElementById('tpl-'+n).content,vals,f);return f},
 walk(src,scope,out){for(const nd of src.childNodes){
  if(nd.nodeType===3){out.appendChild(document.createTextNode(nd.nodeValue.includes('{{')?this.interp(scope,nd.nodeValue):nd.nodeValue));continue}
  if(nd.nodeType!==1)continue;
  if(nd.tagName==='TEMPLATE'){
   if(nd.hasAttribute('data-for')){const raw=nd.getAttribute('list').replace(/^\{\{|\}\}$/g,'');const list=this.look(scope,raw)||[];const as=nd.getAttribute('as')||'item';list.forEach((it,i)=>this.walk(nd.content,Object.assign({},scope,{[as]:it,$index:i}),out))}
   else if(nd.hasAttribute('data-if')){const raw=nd.getAttribute('value').replace(/^\{\{|\}\}$/g,'');if(this.look(scope,raw))this.walk(nd.content,scope,out)}
   else if(nd.hasAttribute('data-import')){out.appendChild(this.comp(nd.getAttribute('name')))}
   continue}
  const el=nd.cloneNode(false);
  for(const a of [...el.attributes]){const v=a.value;if(!v.includes('{{')){if(a.name==='href'&&/\.dc\.html$/.test(v))this.link(el,v);continue}
   const whole=v.match(/^\{\{([^}]*)\}\}$/);const val=whole?this.look(scope,whole[1]):this.interp(scope,v);
   if(a.name.startsWith('on')){el.removeAttribute(a.name);if(typeof val==='function')el.addEventListener(a.name.slice(2),e=>{val(e)});continue}
   el.setAttribute(a.name,val==null?'':String(val));if(a.name==='href'&&/\.dc\.html$/.test(String(val)))this.link(el,String(val))}
  this.walk(nd,scope,el);out.appendChild(el)}},
 link(el,v){el.addEventListener('click',e=>{e.preventDefault();App.screen=v.replace(/^.*\//,'').replace('.dc.html','');if(App.screen==='Workspace'&&App.inst.Main){const w=App.get('Workspace');w.state.role=App.inst.Main.state.picked||'com';w.state.view='dash'}App.render();try{window.scrollTo(0,0)}catch(_){}})},
 render(){const r=document.getElementById('root');const ae=document.activeElement,id=ae&&ae.id,ss=ae&&ae.selectionStart;r.replaceChildren(this.comp(this.screen));if(id){const n=document.getElementById(id);if(n){n.focus();try{if(ss!=null)n.setSelectionRange(ss,ss)}catch(_){}}}}};
document.addEventListener('click',e=>{const a=e.target.closest('a[href="#"]');if(a)e.preventDefault()});
App.render();
